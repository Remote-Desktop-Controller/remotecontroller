name: native-unix-regressions-red
on: [push, workflow_dispatch]
jobs:
  unix-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Observe missing directory durability before correction
        run: cargo test -p runtime-infrastructure --lib retention_directory_sync_order_is_durable --locked -- --nocapture
      - name: Observe private config creation before correction
        if: always()
        run: |
          cargo test -p local-daemon --bin local-daemon install::privacy_red:: --locked -- --nocapture
      - name: Observe private replacement before correction
        if: always()
        run: |
          cargo test -p local-daemon --bin local-daemon host::privacy_red:: --locked -- --nocapture
