[package]
name = "runtime-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
runtime-domain.workspace = true
runtime-ports.workspace = true
runtime-application.workspace = true
runtime-protocol.workspace = true
runtime-transport.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
moka = { version = "0.12", features = ["future"] }
cap-std = "4"
ignore = "0.4"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
git2 = { version = "0.21", default-features = false }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
futures-util.workspace = true
[[bench]]
name = "runtime"
harness = false
