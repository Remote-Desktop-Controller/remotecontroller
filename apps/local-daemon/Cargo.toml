[package]
name = "local-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
# Com dois binários (`local-daemon` e `rdc-monitor`), `cargo run -p local-daemon`
# precisa saber qual executar por padrão.
default-run = "local-daemon"
[dependencies]
runtime-infrastructure.workspace = true
runtime-protocol.workspace = true
runtime-transport.workspace = true
runtime-domain.workspace = true
runtime-ports.workspace = true
runtime-application.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2 = "0.10"
fs2 = "0.4"
serde.workspace = true
toml_edit = "0.22"
[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "local-daemon"
path = "src/main.rs"

[[bin]]
name = "rdc-monitor"
path = "src/monitor_main.rs"
